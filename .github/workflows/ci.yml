name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev nodejs npm libsdl1.2debian libfdt1
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Cache Pebble SDK
        if: runner.os != 'Windows'
        id: cache-pebble-sdk
        uses: actions/cache@v4
        with:
          path: ~/.pebble-sdk
          key: pebble-sdk-${{ runner.os }}-${{ hashFiles('**/sdk_version.nim') }}
          restore-keys: |
            pebble-sdk-${{ runner.os }}-
      
      - name: Install pebble-tool
        if: runner.os != 'Windows'
        run: |
          python -m pip install --user pebble-tool
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          if [ "$(uname)" == "Darwin" ]; then
            echo "$HOME/Library/Python/3.13/bin" >> $GITHUB_PATH
          fi
      
      - name: Install Pebble SDK
        if: runner.os != 'Windows' && steps.cache-pebble-sdk.outputs.cache-hit != 'true'
        run: |
          export PATH="$HOME/Library/Python/3.13/bin:$HOME/.local/bin:$PATH"
          pebble sdk install latest
      
      - name: Add ARM toolchain to path
        if: runner.os != 'Windows'
        run: |
          # Wait for SDK to be fully installed/cached
          sleep 2
          # Try to find arm-none-eabi-size in standard locations
          TOOL_PATH=$(find "$HOME/.pebble-sdk" "/opt/pebble-sdk" -type f -name arm-none-eabi-size -exec dirname {} \; 2>/dev/null | head -n 1)
          if [ -n "$TOOL_PATH" ]; then
            echo "Found ARM toolchain at: $TOOL_PATH"
            echo "$TOOL_PATH" >> $GITHUB_PATH
          else
            echo "Warning: arm-none-eabi-size not found, testSize will be skipped"
          fi
      
      - name: Verify Pebble SDK
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/Library/Python/3.13/bin:$HOME/.local/bin:$PATH"
          pebble --version
          pebble sdk list
          which arm-none-eabi-size || echo "Note: arm-none-eabi-size not in PATH"
      
      - name: Install unittest2
        run: nimble install -y unittest2

      - name: Install Nebble Library
        run: nimble install -y
      
      - name: Build CLI
        run: |
          nimble build
          echo "$(pwd)/bin/tools" >> $GITHUB_PATH
      
      - name: Run Unit Tests
        if: runner.os != 'Windows'
        run: nimble testUnit
      
      - name: Run Integration Tests (Templates)
        if: runner.os != 'Windows'
        run: nimble testExample
        timeout-minutes: 20

      - name: Run Size Checks
        if: runner.os != 'Windows'
        run: nimble testSize
      
      - name: Upload Test Results
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results/
            *.log
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm libsdl1.2debian libfdt1
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.8'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check nimble file syntax
        run: nimble check
      
      - name: Install unittest2
        run: nimble install -y unittest2

      - name: Install Nebble Library
        run: nimble install -y
      
      - name: Check CLI compiles
        run: nimble build
