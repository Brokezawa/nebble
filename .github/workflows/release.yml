name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: nebble-linux-x64
            asset_name: nebble-linux-x64
          - os: macos-latest
            artifact_name: nebble-macos-x64
            asset_name: nebble-macos-x64
          - os: windows-latest
            artifact_name: nebble-windows-x64.exe
            asset_name: nebble-windows-x64.exe

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build CLI Binary
        run: |
          cd cli
          nimble build -d:release
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv bin/nebble.exe bin/${{ matrix.artifact_name }}
          else
            mv bin/nebble bin/${{ matrix.artifact_name }}
          fi
        shell: bash
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: cli/bin/${{ matrix.artifact_name }}

  github-release:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release Notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "# Nebble $VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## What's New" >> RELEASE_NOTES.md
          echo "See [CHANGELOG.md](CHANGELOG.md) for detailed changes." >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Installation" >> RELEASE_NOTES.md
          echo '```bash' >> RELEASE_NOTES.md
          echo 'nimble install nebble' >> RELEASE_NOTES.md
          echo '```' >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/nebble-linux-x64/nebble-linux-x64
            artifacts/nebble-macos-x64/nebble-macos-x64
            artifacts/nebble-windows-x64.exe/nebble-windows-x64.exe
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-nimble:
    runs-on: ubuntu-latest
    needs: github-release
    
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.6'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify Package
        run: nimble check
      
      # Note: Publishing to nimble.directory requires manual approval
      # This step verifies the package is ready for publishing
      - name: Ready for Nimble Publishing
        run: |
          echo "Package verified for publishing"
          echo "To publish, run: nimble publish"
