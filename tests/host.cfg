# Host-native Nim configuration for runtime unit tests
# Unlike nim.cfg, this does NOT cross-compile to ARM
# Tests compile and run natively on macOS

# Add src to the path so `import nebble` resolves
--path:"../src"

# Use basalt as the platform (defines PBL_DISPLAY_WIDTH etc)
-d:pebbleBasalt

# Tell the FFI layer to use mock headers instead of real SDK
--passC:"-I../tests/mocks"

# Compile in debug mode for better test output
-d:debug
