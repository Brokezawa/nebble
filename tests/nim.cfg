# nim.cfg for test_ffi.nim - Pebble SDK cross-compilation
# Generates C code suitable for ARM Cortex-M3 via pebble build

# Target: freestanding ARM
--os:any
--cpu:arm

# Memory management: ARC (compile-time refcounting, no cycle collector)
--mm:arc

# Don't generate Nim's main() - we provide our own
--noMain

# Use malloc/free from the Pebble SDK's libc
-d:useMalloc

# Generate C only, don't try to compile/link
--compileOnly

# No Nim standard library components that require an OS
-d:noSignalHandler

# No threads on bare metal
--threads:off

# Release mode: disable runtime checks, stack traces, etc.
-d:danger

# Pebble platform selection (basalt as default for testing)
-d:pebbleBasalt

# Internal test configuration - these tests are part of the nebble package itself.
# For development, we need to reference the local src/ directory.
# External examples should use `nimble install nebble` or `nimble develop` instead.

--path:"../src"

# Pebble SDK include path (basalt)
--passC:"-I/Users/zawa/Library/Application Support/Pebble SDK/SDKs/4.9.77/sdk-core/pebble/basalt/include"
